server {
 listen 80;
 server_name ai.th.io.vn localhost;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; worker-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
 location = /function-worker.js {
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-eval'; connect-src 'none'; worker-src 'none'" always;
  try_files $uri =404;
 }
 location ^~ /api/internal/ { return 404; }
 location /api/ { proxy_pass http://api:3100; proxy_set_header Host $host; proxy_read_timeout 190s; }
 location / { try_files $uri $uri/ /index.html; }
}

