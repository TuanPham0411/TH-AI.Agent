name: Stop superseded Studio build before deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/studio-superseded.yml']
permissions: {contents: read, actions: write}
jobs:
  cancel-superseded:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const run_id = 40925783354;
            const {owner, repo} = context.repo;
            const {data: {jobs}} = await github.rest.actions.listJobsForWorkflowRun({owner, repo, run_id});
            if (jobs.some(j => j.name === 'deploy' && j.status !== 'queued')) {
              core.info('Deployment has already started; allow it to complete safely.');
              return;
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
            if (['queued', 'pending', 'in_progress'].includes(run.status)) {
              await github.rest.actions.cancelWorkflowRun({owner, repo, run_id});
              core.info('Superseded build stopped before server deployment.');
            }
