name: Build and deploy TH AI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: false
        description: Deploy to the provisioned th-server runner
permissions:
  contents: read
concurrency:
  group: th-ai-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: th_ai_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/th_ai_test
      - run: npm run build
      - run: bash -n deploy/install-release.sh
      - name: Package ARM64 release off the Pi
        shell: bash
        run: |
          set -euo pipefail
          npm prune --omit=dev
          mkdir -p work/release/runtime work/node
          cp -a dist/web dist/server deploy node_modules package.json package-lock.json work/release/
          cd work/node
          curl -fsSL https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt -o SHASUMS256.txt
          archive=$(awk '$2 ~ /^node-v22\..*-linux-arm64.tar.xz$/ {print $2}' SHASUMS256.txt)
          test -n "$archive"
          curl -fsSL "https://nodejs.org/dist/latest-v22.x/$archive" -o "$archive"
          awk -v f="$archive" '$2 == f' SHASUMS256.txt | sha256sum -c -
          tar -xJf "$archive" --strip-components=1 -C ../release/runtime
          cd ..
          tar -C release -czf ai-release.tar.gz .
          sha256sum ai-release.tar.gz > ai-release.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ai-release
          path: |
            work/ai-release.tar.gz
            work/ai-release.sha256
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    environment: th-ai-production
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - name: Verify runner
        env: {SELECTED_RUNNER: '${{ runner.name }}'}
        run: test "$SELECTED_RUNNER" = th-server
      - uses: actions/download-artifact@v4
        with:
          name: ai-release
          path: ${{ runner.temp }}/ai-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy trusted artifact
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/ai-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -eu
          cd "$ARTIFACT_DIR"
          sha256sum -c ai-release.sha256
          mkdir unpacked
          tar -xzf ai-release.tar.gz -C unpacked
          sudo -n /usr/local/sbin/th-ai-deploy "$ARTIFACT_DIR/unpacked" "$RELEASE_ID"
      - name: Verify public route
        run: |
          curl --fail --retry 3 --max-time 20 https://ai.th.io.vn/
          curl --fail --retry 3 --max-time 20 https://ai.th.io.vn/api/ready
