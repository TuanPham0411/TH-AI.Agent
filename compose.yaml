services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: th_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set operator password}
      TH_AI_DB_PASSWORD: ${TH_AI_DB_PASSWORD:?Set separate runtime password}
    volumes:
      - ai-db:/var/lib/postgresql/data
      - ./database-init.sh:/docker-entrypoint-initdb.d/ai-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d th_ai]
      interval: 5s
      retries: 12
    restart: unless-stopped
  migrate:
    image: ghcr.io/tuanpham0411/th-ai-agent-api:${IMAGE_TAG:-latest}
    build: {context: ., target: api}
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/th_ai
      RUNTIME_DB_ROLE: th_ai_api
    command: [node, server/migrate.js]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  api:
    image: ghcr.io/tuanpham0411/th-ai-agent-api:${IMAGE_TAG:-latest}
    build: {context: ., target: api}
    environment:
      DATABASE_URL: postgresql://th_ai_api:${TH_AI_DB_PASSWORD}@db:5432/th_ai
    volumes: ["ai-files:/var/lib/th-ai/files"]
    mem_limit: 224m
    cpus: 0.5
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 5
  web:
    image: ghcr.io/tuanpham0411/th-ai-agent-web:${IMAGE_TAG:-latest}
    build: {context: ., target: web}
    ports: ["127.0.0.1:8081:80"]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
volumes:
  ai-db:
  ai-files:
